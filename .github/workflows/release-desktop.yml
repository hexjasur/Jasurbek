name: Release desktop app

# Builds the Windows installer (with signed updater artifacts and latest.json) and the
# Android APK, then publishes one GitHub Release. The website deploy (deploy.yml) is separate
# and is not affected by this workflow.

on:
  push:
    branches: [master]
  workflow_dispatch:
    inputs:
      force:
        description: Rebuild even if the tag already exists
        type: boolean
        default: false

concurrency:
  group: release-desktop
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  check-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
      should_release: ${{ steps.tag.outputs.should_release }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - id: version
        run: echo "version=$(bun scripts/check-version.ts)" >> "$GITHUB_OUTPUT"
      - id: tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
          FORCE: ${{ inputs.force }}
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/v${VERSION}" >/dev/null 2>&1 && [ "$FORCE" != "true" ]; then
            echo "Tag v${VERSION} already exists; skipping release."
            echo "should_release=false" >> "$GITHUB_OUTPUT"
          else
            echo "should_release=true" >> "$GITHUB_OUTPUT"
          fi

  create-release:
    needs: check-version
    if: needs.check-version.outputs.should_release == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release_id: ${{ steps.create.outputs.release_id }}
    steps:
      - id: create
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: v${{ needs.check-version.outputs.version }}
        run: |
          id=$(gh api "repos/${GITHUB_REPOSITORY}/releases" \
            -f tag_name="$TAG" -f name="Jasurdev $TAG" -f target_commitish="$GITHUB_SHA" \
            -F draft=true -F prerelease=false --jq .id)
          echo "release_id=$id" >> "$GITHUB_OUTPUT"

  build-windows:
    needs: [check-version, create-release]
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
      - run: bun install --frozen-lockfile
      - uses: tauri-apps/tauri-action@1deb371b0cd8bd54025b384f1cd735e725c4060f # v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          PUBLIC_REMOVE_BG_KEY: ${{ secrets.PUBLIC_REMOVE_BG_KEY }}
          PUBLIC_POOF_BG_KEY: ${{ secrets.PUBLIC_POOF_BG_KEY }}
        with:
          releaseId: ${{ needs.create-release.outputs.release_id }}
          tagName: v${{ needs.check-version.outputs.version }}
          releaseDraft: true

  build-android:
    needs: [check-version, create-release]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: v${{ needs.check-version.outputs.version }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
      - uses: dtolnay/rust-toolchain@39008827e6b4319a349e9a42dfc90579dd25f1ca # stable
        with:
          targets: aarch64-linux-android,armv7-linux-androideabi,i686-linux-android,x86_64-linux-android
      - uses: swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0 # v2
        with:
          workspaces: './src-tauri -> target'
      - run: bun install --frozen-lockfile
      - name: Generate the Android project
        run: bunx tauri android init --ci
      - name: Restore the release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "ANDROID_KEYSTORE_BASE64 is not set"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/release.jks"
          printf 'password=%s\nkeyAlias=%s\nkeyPassword=%s\nstoreFile=%s\n' \
            "$KEYSTORE_PASSWORD" "$KEY_ALIAS" "$KEY_PASSWORD" "$RUNNER_TEMP/release.jks" \
            > src-tauri/gen/android/keystore.properties
      - name: Build the APK
        run: bunx tauri android build --apk --ci
      - name: Attach the APK to the draft release
        run: |
          apk=$(find src-tauri/gen/android -name '*release*.apk' | head -n 1)
          test -n "$apk" || { echo "No release APK was produced"; exit 1; }
          cp "$apk" "jasurdev-${TAG}.apk"
          gh release upload "$TAG" "jasurdev-${TAG}.apk" --clobber

  publish:
    needs: [check-version, create-release, build-windows, build-android]
    if: needs.build-windows.result == 'success' && needs.build-android.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      RELEASE_ID: ${{ needs.create-release.outputs.release_id }}
      VERSION: ${{ needs.check-version.outputs.version }}
      REQUIRED_PLATFORMS: windows-x86_64
    steps:
      - name: Verify latest.json before publishing
        run: |
          asset=$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}/assets" --jq '.[] | select(.name=="latest.json") | .id')
          test -n "$asset" || { echo "latest.json is missing"; exit 1; }
          gh api -H "Accept: application/octet-stream" "repos/${GITHUB_REPOSITORY}/releases/assets/${asset}" > latest.json
          jq -e --arg v "$VERSION" '(.version | ltrimstr("v")) == $v' latest.json >/dev/null
          for p in $REQUIRED_PLATFORMS; do
            jq -e --arg p "$p" '.platforms[$p].url | startswith("https://")' latest.json >/dev/null || { echo "missing platform $p"; exit 1; }
            jq -e --arg p "$p" '.platforms[$p].signature | length > 0' latest.json >/dev/null || { echo "empty signature for $p"; exit 1; }
          done
      - name: Publish the release
        run: gh api -X PATCH "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}" -F draft=false -f make_latest=true
