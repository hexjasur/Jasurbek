<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 260" font-family="system-ui, Arial, sans-serif" xmlns:c2pa="http://c2pa.org/manifest">
  <title>Branch chizmasi</title>
  <desc>main asosiy çiziq. iş-branch undan ajralib, öz commit'lari bilan davom etadi.</desc>
  <rect x="0" y="0" width="760" height="260" rx="16" fill="#f1f5f9"/>

  <!-- main çiziği -->
  <text x="30" y="58" font-size="16" font-weight="700" fill="#0f172a">main</text>
  <line x1="110" y1="60" x2="730" y2="60" stroke="#2563eb" stroke-width="4" stroke-linecap="round"/>
  <circle cx="150" cy="60" r="10" fill="#fff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="250" cy="60" r="10" fill="#fff" stroke="#2563eb" stroke-width="4"/>
  <circle cx="350" cy="60" r="10" fill="#fff" stroke="#2563eb" stroke-width="4"/>

  <!-- iş-branch çiziği -->
  <path d="M350 60 C 380 60, 380 160, 410 160 L 560 160" fill="none" stroke="#f59e0b" stroke-width="4" stroke-linecap="round"/>
  <text x="30" y="164" font-size="16" font-weight="700" fill="#0f172a">iş-branch</text>
  <circle cx="450" cy="160" r="10" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="530" cy="160" r="10" fill="#fff" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="610" cy="160" r="10" fill="#f59e0b"/>

  <!-- HEAD -->
  <text x="610" y="200" text-anchor="middle" font-size="13" font-weight="700" fill="#b45309">HEAD (siz şu yerdasiz)</text>

  <!-- izoh -->
  <text x="150" y="110" font-size="13" fill="#334155">asosiy yöl özgarmaydi</text>
  <text x="380" y="235" font-size="13" fill="#334155">iş şu yerda, alohida yölda</text>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>