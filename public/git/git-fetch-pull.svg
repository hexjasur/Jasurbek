<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 270" role="img" aria-labelledby="fp-title fp-desc">
  <title id="fp-title">Fetch updates origin/main, pull also merges it into main</title>
  <desc id="fp-desc">Three rows of commits. The server origin has a new commit from a teammate. git fetch copies that commit to origin/main on your machine. Your main has its own commit, so git pull merges both histories into main.</desc>

  <rect width="760" height="270" rx="16" fill="#faf7f1" />

  <g font-family="ui-sans-serif, system-ui, sans-serif">
    <text x="24" y="66" font-size="14" font-weight="700" fill="#3c372f">origin (server)</text>
    <text x="24" y="84" font-size="12" fill="#8a8273">where the team pushes</text>

    <text x="24" y="146" font-size="14" font-weight="700" fill="#3c372f">origin/main</text>
    <text x="24" y="164" font-size="12" fill="#8a8273">your copy of the server</text>

    <text x="24" y="226" font-size="14" font-weight="700" fill="#3c372f">main</text>
    <text x="24" y="244" font-size="12" fill="#8a8273">your branch</text>
  </g>

  <g stroke="#9a9184" stroke-width="3" fill="none">
    <line x1="260" y1="70" x2="370" y2="70" />
    <line x1="370" y1="70" x2="480" y2="70" />
    <line x1="260" y1="150" x2="370" y2="150" />
    <line x1="260" y1="230" x2="370" y2="230" />
    <line x1="370" y1="230" x2="480" y2="230" />
  </g>

  <g>
    <circle cx="260" cy="70" r="10" fill="#3d6a9e" stroke="#fffdf8" stroke-width="3" />
    <circle cx="370" cy="70" r="10" fill="#3d6a9e" stroke="#fffdf8" stroke-width="3" />
    <circle cx="480" cy="70" r="10" fill="#b86752" stroke="#fffdf8" stroke-width="3" />

    <circle cx="260" cy="150" r="10" fill="#3d6a9e" stroke="#fffdf8" stroke-width="3" />
    <circle cx="370" cy="150" r="10" fill="#3d6a9e" stroke="#fffdf8" stroke-width="3" />

    <circle cx="260" cy="230" r="10" fill="#4f7a5b" stroke="#fffdf8" stroke-width="3" />
    <circle cx="370" cy="230" r="10" fill="#4f7a5b" stroke="#fffdf8" stroke-width="3" />
    <circle cx="480" cy="230" r="10" fill="#c79a2e" stroke="#fffdf8" stroke-width="3" />
  </g>

  <g font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="11" text-anchor="middle" fill="#8a8273">
    <text x="260" y="52">9f2c</text>
    <text x="370" y="52">4e1a</text>
    <text x="480" y="52">b7d0</text>
    <text x="260" y="132">9f2c</text>
    <text x="370" y="132">4e1a</text>
    <text x="260" y="212">9f2c</text>
    <text x="370" y="212">4e1a</text>
    <text x="480" y="212">c3e9</text>
  </g>

  <text x="480" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#b86752">teammate</text>
  <text x="480" y="258" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="700" fill="#c79a2e">yours</text>

  <g stroke="#b86752" stroke-width="2.5" fill="none" stroke-dasharray="6 5">
    <path d="M 600 92 L 600 128" marker-end="url(#fp-arrow)" />
    <path d="M 600 172 L 600 208" marker-end="url(#fp-arrow)" />
  </g>
  <defs>
    <marker id="fp-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto">
      <path d="M0,0 L8,4 L0,8 z" fill="#b86752" />
    </marker>
  </defs>

  <g font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#3c372f">
    <text x="614" y="114"><tspan font-weight="700">git fetch</tspan></text>
    <text x="614" y="132" fill="#8a8273">moves origin/main only</text>
    <text x="614" y="194"><tspan font-weight="700">git pull</tspan></text>
    <text x="614" y="212" fill="#8a8273">fetch + merge into main</text>
  </g>
</svg>
