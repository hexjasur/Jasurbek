<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 310" role="img" aria-labelledby="t2 d2">
  <title id="t2">sin x grafigi va [0, π] oraliqdagi yuza</title>
  <desc id="d2">y = sin x funksiyasi grafigi x = 0 dan x = π gacha. Grafik bilan x öqi orasidagi yuza yashil rang bilan bo'yalgan. Bu yuza ∫ sin x dx integraliga teng: 0 dan π gacha integral 2 ga teng. Eng yuqori nuqta x = π/2 da, y = 1.</desc>
