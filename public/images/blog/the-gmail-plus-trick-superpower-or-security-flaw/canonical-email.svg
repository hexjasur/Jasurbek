<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 310" role="img" aria-labelledby="g-title g-desc">
  <title id="g-title">Email input mapped to display and canonical columns</title>
  <desc id="g-desc">The address typed by a user is stored in display_email as typed. The normalized form, with the +tag and dots removed and googlemail.com mapped to gmail.com, is stored in canonical_email, which has the unique constraint.</desc>
  <defs>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="5" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#2F4038"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="720" height="310" rx="12" fill="#FBF6EC"/>

  <!-- Input -->
  <rect x="20" y="105" width="270" height="90" rx="10" fill="#F1E9DC" stroke="#2F4038" stroke-width="1.5"/>
  <text x="36" y="128" font-family="system-ui, sans-serif" font-size="13" fill="#3f5147">Input (user typed)</text>
  <text x="36" y="167" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#2F4038">Jasur.H+news@googlemail.com</text>

  <!-- Arrows -->
  <path d="M290,140 C335,140 335,80 380,80" fill="none" stroke="#2F4038" stroke-width="2" marker-end="url(#arrow)"/>
  <path d="M290,150 C335,150 335,220 380,220" fill="none" stroke="#2F4038" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="298" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#3f5147">trim only</text>
  <text x="298" y="250" font-family="system-ui, sans-serif" font-size="12" fill="#3f5147">normalize</text>

  <!-- Display column -->
  <rect x="380" y="40" width="320" height="80" rx="10" fill="#C7D2B1" stroke="#2F4038" stroke-width="1.5"/>
  <text x="396" y="62" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#2F4038">display_email</text>
  <text x="396" y="98" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#2F4038">Jasur.H+news@googlemail.com</text>

  <!-- Canonical column -->
  <rect x="380" y="180" width="320" height="80" rx="10" fill="#B86752" stroke="#2F4038" stroke-width="1.5"/>
  <text x="396" y="202" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="13" font-weight="700" fill="#FBF6EC">canonical_email (UNIQUE)</text>
  <text x="396" y="238" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="15" fill="#FBF6EC">jasurh@gmail.com</text>

  <text x="20" y="282" font-family="system-ui, sans-serif" font-size="13" fill="#3f5147">Gmail rules: drop the +tag, drop dots, googlemail.com becomes gmail.com.</text>
</svg>
