<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 300" width="640" height="300" role="img" aria-labelledby="uz-alpha-title uz-alpha-desc" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif">
  <title id="uz-alpha-title">Four letter replacements in the 2026 Uzbek Latin alphabet</title>
  <desc id="uz-alpha-desc">Table with three columns: Cyrillic letter, legacy 1995 Latin spelling, and reformed 2026 Latin letter. Ў and Oʻ become Ö. Ғ and Gʻ become Ğ. Ш and Sh become Ş. Ч and Ch become Ç.</desc>
  <rect x="0" y="0" width="640" height="300" fill="#ffffff"/>
  <rect x="0" y="24" width="640" height="48" fill="#f6f8fa"/>
  <rect x="404" y="72" width="212" height="208" fill="#c7d2b1" fill-opacity="0.42"/>
  <g stroke="#d0d7de" stroke-width="1" fill="none">
    <rect x="24" y="24" width="592" height="256"/>
    <line x1="24" y1="72" x2="616" y2="72"/>
    <line x1="24" y1="124" x2="616" y2="124"/>
    <line x1="24" y1="176" x2="616" y2="176"/>
    <line x1="24" y1="228" x2="616" y2="228"/>
    <line x1="204" y1="24" x2="204" y2="280"/>
    <line x1="404" y1="24" x2="404" y2="280"/>
  </g>
  <g fill="#1f2328" font-size="16" font-weight="700">
    <text x="44" y="54">Cyrillic</text>
    <text x="224" y="54">Legacy (1995)</text>
    <text x="424" y="54">Reformed (2026)</text>
  </g>
  <g fill="#1f2328" font-size="20">
    <text x="44" y="105">Ў ў</text>
    <text x="224" y="105">Oʻ oʻ</text>
    <text x="424" y="105" font-size="22" font-weight="700">Ö ö</text>

    <text x="44" y="157">Ғ ғ</text>
    <text x="224" y="157">Gʻ gʻ</text>
    <text x="424" y="157" font-size="22" font-weight="700">Ğ ğ</text>

    <text x="44" y="209">Ш ш</text>
    <text x="224" y="209">Sh sh</text>
    <text x="424" y="209" font-size="22" font-weight="700">Ş ş</text>

    <text x="44" y="261">Ч ч</text>
    <text x="224" y="261">Ch ch</text>
    <text x="424" y="261" font-size="22" font-weight="700">Ç ç</text>
  </g>
</svg>
