<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-labelledby="nw-t nw-d">
  <title id="nw-t">Newton usuli: x0 = 1.5 dagi urinma birinchi qadamda x1 ≈ 1.5217 ni beradi</title>
  <desc id="nw-d">f(x)=x^3-x-2 egri çiziği. x0=1.5 nuqtada f(x0)=-0.125, hosila 5.75. Urinma çiziq x-öqni x1 = 1.5 + 0.125/5.75 ≈ 1.52174 nuqtada kesadi.</desc>
