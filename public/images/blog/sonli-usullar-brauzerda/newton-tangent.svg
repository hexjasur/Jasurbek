    .ax { stroke: #71717a; stroke-width: 1.5; }
    .grid { stroke: #d4d4d8; stroke-width: 1; }
    .iv { stroke: #2563eb; stroke-width: 6; stroke-linecap: round; }
    .curve { fill: none; stroke: #2563eb; stroke-width: 2.5; }
    .tan { fill: none; stroke: #dc2626; stroke-width: 2; }
    .dash { stroke: #71717a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .pt { fill: #dc2626; }
    .mk { fill: #18181b; }
    .lbl { fill: #18181b; font-size: 14px; }
    .lblb { fill: #18181b; font-size: 14px; font-weight: 700; }
    .sm { fill: #52525b; font-size: 12px; }
    .head { fill: #18181b; font-size: 16px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #a1a1aa; } .grid { stroke: #3f3f46; }
      .iv { stroke: #60a5fa; } .curve { stroke: #60a5fa; }
      .tan { stroke: #f87171; } .dash { stroke: #a1a1aa; }
      .pt { fill: #f87171; } .mk { fill: #f4f4f5; }
      .lbl, .lblb, .head { fill: #f4f4f5; } .sm { fill: #d4d4d8; }
    }
  </style>
    <text class="head" x="20" y="24">Newton: x0 = 1.5 nuqtasidagi urinma x-öqni x1 ≈ 1.5217 da kesadi</text>
