<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 330" role="img" aria-labelledby="bis-t bis-d">
  <title id="bis-t">Bisection: uch qadamda [1, 2] oraliqning yarmiga bölinishi</title>
  <desc id="bis-d">Uch qator oraliq. Qadam 1: a=1, b=2, c=1.5. Qadam 2: a=1.5, b=2, c=1.75. Qadam 3: a=1.5, b=1.75, c=1.625. Funksiya f(x)=x^3-x-2 uchun. Har qadamda oraliq yarmiga qisqaradi.</desc>
  <style>
    text { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; }
    .ax { stroke: #71717a; stroke-width: 1.5; }
    .grid { stroke: #d4d4d8; stroke-width: 1; }
    .iv { stroke: #2563eb; stroke-width: 6; stroke-linecap: round; }
    .curve { fill: none; stroke: #2563eb; stroke-width: 2.5; }
    .tan { fill: none; stroke: #dc2626; stroke-width: 2; }
    .dash { stroke: #71717a; stroke-width: 1.5; stroke-dasharray: 5 4; }
    .pt { fill: #dc2626; }
    .mk { fill: #18181b; }
    .lbl { fill: #18181b; font-size: 14px; }
    .lblb { fill: #18181b; font-size: 14px; font-weight: 700; }
    .sm { fill: #52525b; font-size: 12px; }
    .head { fill: #18181b; font-size: 16px; font-weight: 700; }
    @media (prefers-color-scheme: dark) {
      .ax { stroke: #a1a1aa; } .grid { stroke: #3f3f46; }
      .iv { stroke: #60a5fa; } .curve { stroke: #60a5fa; }
      .tan { stroke: #f87171; } .dash { stroke: #a1a1aa; }
      .pt { fill: #f87171; } .mk { fill: #f4f4f5; }
      .lbl, .lblb, .head { fill: #f4f4f5; } .sm { fill: #d4d4d8; }
    }
  </style>
    <text class="head" x="20" y="28">Bisection: [1, 2] oraliği ketma-ket yarmiga bölinadi (f(x) = x³ − x − 2)</text>
  <line class="grid" x1="60.0" y1="60" x2="60.0" y2="280"/>
  <text class="sm" x="60.0" y="300" text-anchor="middle">1</text>
  <line class="grid" x1="195.0" y1="60" x2="195.0" y2="280"/>
  <text class="sm" x="195.0" y="300" text-anchor="middle">1.25</text>
  <line class="grid" x1="330.0" y1="60" x2="330.0" y2="280"/>
  <text class="sm" x="330.0" y="300" text-anchor="middle">1.5</text>
  <line class="grid" x1="465.0" y1="60" x2="465.0" y2="280"/>
  <text class="sm" x="465.0" y="300" text-anchor="middle">1.75</text>
  <line class="grid" x1="600.0" y1="60" x2="600.0" y2="280"/>
  <text class="sm" x="600.0" y="300" text-anchor="middle">2</text>
  <text class="lblb" x="20" y="95">Qadam 1</text>
  <line class="iv" x1="60.0" y1="90" x2="600.0" y2="90"/>
  <circle class="mk" cx="60.0" cy="90" r="4"/>
  <circle class="mk" cx="600.0" cy="90" r="4"/>
  <circle class="pt" cx="330.0" cy="90" r="5"/>
  <text class="lbl" x="60.0" y="78" text-anchor="middle">a=1</text>
  <text class="lbl" x="600.0" y="78" text-anchor="middle">b=2</text>
  <text class="lblb" x="330.0" y="112" text-anchor="middle">c=1.5</text>
  <text class="lblb" x="20" y="165">Qadam 2</text>
  <line class="iv" x1="330.0" y1="160" x2="600.0" y2="160"/>
  <circle class="mk" cx="330.0" cy="160" r="4"/>
  <circle class="mk" cx="600.0" cy="160" r="4"/>
  <circle class="pt" cx="465.0" cy="160" r="5"/>
  <text class="lbl" x="330.0" y="148" text-anchor="middle">a=1.5</text>
  <text class="lbl" x="600.0" y="148" text-anchor="middle">b=2</text>
  <text class="lblb" x="465.0" y="182" text-anchor="middle">c=1.75</text>
  <text class="lblb" x="20" y="235">Qadam 3</text>
  <line class="iv" x1="330.0" y1="230" x2="465.0" y2="230"/>
  <circle class="mk" cx="330.0" cy="230" r="4"/>
  <circle class="mk" cx="465.0" cy="230" r="4"/>
  <circle class="pt" cx="397.5" cy="230" r="5"/>
  <text class="lbl" x="330.0" y="218" text-anchor="middle">a=1.5</text>
  <text class="lbl" x="465.0" y="218" text-anchor="middle">b=1.75</text>
  <text class="lblb" x="397.5" y="252" text-anchor="middle">c=1.625</text>
  <line class="ax" x1="60" y1="280" x2="600" y2="280"/>
</svg>
